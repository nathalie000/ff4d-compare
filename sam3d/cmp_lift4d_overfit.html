<header><h1>Lift4D — training on in-the-wild video (overfitting + generalization)</h1><p><a href="index.html">&larr; all evals</a> &nbsp;|&nbsp; rows: <b>Ours synthetic-only &middot; Ours tuned (synth&rarr;wild) &middot; Ours from-scratch (wild) &middot; Per-frame SAM-3D</b>; rotmv, full-image path</p>
<button id=toggleAll onclick="toggleAll()">&#9208; Pause all</button></header>
<script>
function toggleAll(){
  const vids=document.querySelectorAll('video'), b=document.getElementById('toggleAll');
  const anyPlaying=[...vids].some(v=>!v.paused);
  vids.forEach(v=>{ anyPlaying?v.pause():v.play().catch(()=>{}); });
  b.innerHTML=anyPlaying?'&#9654; Play all':'&#9208; Pause all';
}
</script>
