<!doctype html><html lang=en><meta charset=utf-8>
<meta name=viewport content="width=device-width, initial-scale=1">
<title>Baseline comparison — animal-in-motion</title>
<style>
:root{color-scheme:dark}
body{font-family:system-ui,sans-serif;background:#111;color:#eee;margin:0;padding:0}
header{position:sticky;top:0;background:#181818;border-bottom:1px solid #333;padding:10px 16px;z-index:5}
h1{font-size:18px;margin:0 0 8px}
.ctl{display:flex;gap:18px;flex-wrap:wrap;align-items:center;font-size:14px}
.ctl b{color:#9ab}
label{cursor:pointer;user-select:none;margin-right:8px}
input{accent-color:#7aa2ff}
#grid{padding:12px 16px}
.row{margin:0 0 22px}
.sha{font:14px/1.6 ui-monospace,monospace;color:#8aa;margin-bottom:3px}
.tiles{display:flex;gap:10px;overflow-x:auto}
.tile{flex:0 0 auto;max-width:680px;position:relative}
.tile video{width:100%;max-width:680px;display:block;background:#000;border:1px solid #2a2a2a;border-radius:4px}
.cap{font-size:15px;color:#ddd;margin-top:3px;display:flex;justify-content:space-between;gap:10px}
.cap .m{color:#7aa2ff;font-weight:700}
.score{position:absolute;left:6px;top:62%;transform:translateY(-50%);
  background:rgba(20,20,20,.82);border:1px solid #444;border-radius:6px;
  padding:4px 8px;font:600 13px/1.5 ui-monospace,monospace;color:#ffd479;
  pointer-events:none;white-space:pre-line;text-align:right}
.na{display:flex;align-items:center;justify-content:center;color:#555;border:1px dashed #333;
    border-radius:4px;min-height:120px;width:320px;font-size:14px}
.count{color:#789;font-size:13px;margin-left:auto}
</style>
<header>
<h1>Baseline comparison — animal-in-motion <span style="color:#678;font-weight:400">(5 wild sequences, 32f (no canonical columns))</span></h1>
<div class=ctl>
  <span><b>Methods:</b> <span id=meths></span></span>
  <span><b>Rendering:</b> <span id=types></span></span>
  <span><b>Speed:</b> <span id=speeds></span></span>
  <span><button id=pp style="font-size:14px;padding:3px 12px;cursor:pointer;background:#26304a;color:#dfe6ff;border:1px solid #44507a;border-radius:5px">&#10074;&#10074; pause</button></span>
  <span class=count id=count></span>
</div>
</header>
<div id=grid></div>
<script>
const D = {"shas": ["bear", "deer", "elephant", "mose_cat", "tiger"], "methods": [["ours", "Ours"], ["perframe_tuned", "PF-tuned"], ["actionmesh", "ActionMesh"], ["m3t4", "M3T4"]], "types": [["app_gs", "Gaussian (app)"], ["app_gs_tracks", "Gaussian + tracks"]], "metrics": {"bear": {"perframe_tuned": {"epe": 0.0236, "psnr": 8.63}, "m3t4": {"epe": 0.0254, "psnr": 12.25}}, "deer": {"perframe_tuned": {"epe": 0.0054, "psnr": 15.92}, "m3t4": {"epe": 0.0029, "psnr": 18.28}}, "elephant": {"perframe_tuned": {"epe": 0.0058, "psnr": 9.47}, "m3t4": {"epe": 0.0191, "psnr": 14.85}}, "mose_cat": {"perframe_tuned": {"epe": 0.0397, "psnr": 8.23}, "m3t4": {"epe": 0.1997, "psnr": 7.69}}, "tiger": {"perframe_tuned": {"epe": 0.0464, "psnr": 8.01}, "m3t4": {"epe": 0.0212, "psnr": 11.76}}}, "avail": {"ours": {"bear": ["app_gs", "app_gs_tracks"], "deer": ["app_gs", "app_gs_tracks"], "elephant": ["app_gs", "app_gs_tracks"], "mose_cat": ["app_gs", "app_gs_tracks"], "tiger": ["app_gs", "app_gs_tracks"]}, "perframe_tuned": {"bear": ["app_gs", "app_gs_tracks"], "deer": ["app_gs", "app_gs_tracks"], "elephant": ["app_gs", "app_gs_tracks"], "mose_cat": ["app_gs", "app_gs_tracks"], "tiger": ["app_gs", "app_gs_tracks"]}, "actionmesh": {"bear": ["app_gs"], "deer": ["app_gs"], "elephant": ["app_gs"], "mose_cat": ["app_gs"], "tiger": ["app_gs"]}, "m3t4": {"bear": ["app_gs"], "deer": ["app_gs"], "elephant": ["app_gs"], "mose_cat": ["app_gs"], "tiger": ["app_gs"]}}, "prefix": "bc_aim", "default_type": "app_gs", "title": "animal-in-motion", "subtitle": "5 wild sequences, 32f (no canonical columns)"};
const state = {methods:["ours","actionmesh","m3t4"], type:D.default_type, rate:1.0};
const mname = Object.fromEntries(D.methods);
function metric(sha, m){
  const md = (D.metrics[sha]||{})[m]||{};
  let s=[];
  if (state.type.startsWith("geom")){
    if(md.cd3!==undefined)s.push(`CD-3D ${md.cd3}`);
    if(md.cd4!==undefined)s.push(`CD-4D ${md.cd4}`);
  } else {
    if(md.psnr!==undefined)s.push(`PSNR ${md.psnr}`);
    if(md.epe!==undefined)s.push(`EPE ${md.epe}`);
  }
  return s;
}
function build(){
  const g=document.getElementById("grid"); g.innerHTML="";
  let shown=0;
  for(const sha of D.shas){
    const row=document.createElement("div"); row.className="row";
    row.innerHTML=`<div class=sha>${sha}</div>`;
    const tiles=document.createElement("div"); tiles.className="tiles";
    let any=false;
    for(const m of state.methods){
      const t=document.createElement("div"); t.className="tile";
      const sc=metric(sha,m);
      if((D.avail[m][sha]||[]).includes(state.type)){
        any=true;
        t.innerHTML=`<video muted loop playsinline preload=none
          data-src="${D.prefix}/${m}/${sha}/${state.type}.mp4"></video>
          ${sc.length?`<div class=score>${sc.join("\n")}</div>`:""}
          <div class=cap><span class=m>${mname[m]}</span><span>${sc.join(" · ")}</span></div>`;
      } else {
        t.innerHTML=`<div class=na>${mname[m]}: n/a</div>
          <div class=cap><span class=m>${mname[m]}</span></div>`;
      }
      tiles.appendChild(t);
    }
    if(!any) continue;
    shown++;
    row.appendChild(tiles); g.appendChild(row);
  }
  document.getElementById("count").textContent=`${shown} samples`;
  observe();
}
const io=new IntersectionObserver(es=>{for(const e of es){
  const v=e.target;
  if(e.isIntersecting){ if(!v.src){v.src=v.dataset.src;} v.playbackRate=state.rate;
    if(state.playing) v.play().catch(()=>{}); }
  else v.pause();
}},{rootMargin:"200px"});
function observe(){document.querySelectorAll("video[data-src]").forEach(v=>{
  io.observe(v);
  v.onclick=()=>{ v.paused ? v.play().catch(()=>{}) : v.pause(); };
});}
state.playing=true;
document.getElementById("pp").onclick=()=>{
  state.playing=!state.playing;
  const b=document.getElementById("pp");
  b.innerHTML=state.playing?"&#10074;&#10074; pause":"&#9654; play";
  document.querySelectorAll("video").forEach(v=>{
    if(state.playing){ if(!v.src&&v.dataset.src)v.src=v.dataset.src; v.play().catch(()=>{}); }
    else v.pause();
  });
};
function ctls(){
  const ms=document.getElementById("meths");
  for(const [k,n] of D.methods){
    const l=document.createElement("label");
    l.innerHTML=`<input type=checkbox value=${k} ${state.methods.includes(k)?"checked":""}> ${n}`;
    l.firstChild.onchange=e=>{
      if(e.target.checked) state.methods=D.methods.map(x=>x[0]).filter(x=>x===k||state.methods.includes(x));
      else state.methods=state.methods.filter(x=>x!==k);
      build();};
    ms.appendChild(l);
  }
  const sp=document.getElementById("speeds");
  for(const r of [0.25,0.5,1,2]){
    const l=document.createElement("label");
    l.innerHTML=`<input type=radio name=spd value=${r} ${r===state.rate?"checked":""}> ${r}x`;
    l.firstChild.onchange=()=>{state.rate=r;
      document.querySelectorAll("video").forEach(v=>{v.playbackRate=r;});};
    sp.appendChild(l);
  }
  const ts=document.getElementById("types");
  for(const [k,n] of D.types){
    const l=document.createElement("label");
    l.innerHTML=`<input type=radio name=vt value=${k} ${k===state.type?"checked":""}> ${n}`;
    l.firstChild.onchange=()=>{state.type=k;build();};
    ts.appendChild(l);
  }
}
ctls(); build();
</script>
