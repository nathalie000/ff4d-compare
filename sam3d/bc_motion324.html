const mname = Object.fromEntries(D.methods);
function metric(sha, m){
  const md = (D.metrics[sha]||{})[m]||{};
  if (state.type.startsWith("geom"))
    return (md.cd!==undefined)?`CD ${md.cd}`:"";
  let s=[]; if(md.psnr!==undefined)s.push(`PSNR ${md.psnr}`);
  if(md.epe!==undefined)s.push(`EPE ${md.epe}`); return s.join(" · ");
}
function build(){
  const g=document.getElementById("grid"); g.innerHTML="";
  let shown=0;
  for(const sha of D.shas){
    const row=document.createElement("div"); row.className="row";
    row.innerHTML=`<div class=sha>${sha}</div>`;
    const tiles=document.createElement("div"); tiles.className="tiles";
    let any=false;
    for(const m of state.methods){
      const t=document.createElement("div"); t.className="tile";
      if((D.avail[m][sha]||[]).includes(state.type)){
        any=true;
        t.innerHTML=`<video muted loop playsinline preload=none
          data-src="${D.prefix}/${m}/${sha}/${state.type}.mp4"></video>
          <div class=cap><span class=m>${mname[m]}</span><span>${metric(sha,m)}</span></div>`;
      } else {
        t.innerHTML=`<div class=na>${mname[m]}: n/a</div>
          <div class=cap><span class=m>${mname[m]}</span></div>`;
      }
      tiles.appendChild(t);

    if(!any) continue;
    shown++;
    row.appendChild(tiles); g.appendChild(row);
  }
  document.getElementById("count").textContent=`${shown} samples`;
  observe();
}
const io=new IntersectionObserver(es=>{for(const e of es){

  else v.pause();
}},{rootMargin:"200px"});
function observe(){document.querySelectorAll("video[data-src]").forEach(v=>io.observe(v));}
function ctls(){
  const ms=document.getElementById("meths");
  for(const [k,n] of D.methods){
    const l=document.createElement("label");
    l.innerHTML=`<input type=checkbox value=${k} ${state.methods.includes(k)?"checked":""}> ${n}`;

      if(e.target.checked) state.methods=D.methods.map(x=>x[0]).filter(x=>x===k||state.methods.includes(x));

      build();};

  }

    const l=document.createElement("label");
    l.innerHTML=`<input type=radio name=vt value=${k} ${k===state.type?"checked":""}> ${n}`;
    l.firstChild.onchange=()=>{state.type=k;build();};
    ts.appendChild(l);
  }
