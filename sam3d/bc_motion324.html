const state = {methods:["ours","actionmesh","m3t4"], type:D.default_type, rate:1.0};
const mname = Object.fromEntries(D.methods);
function metric(sha, m){
  const md = (D.metrics[sha]||{})[m]||{};
  let s=[];
  if (state.type.startsWith("geom")){
    if(md.cd3!==undefined)s.push(`CD-3D ${md.cd3}`);
    if(md.cd4!==undefined)s.push(`CD-4D ${md.cd4}`);
  } else {
    if(md.psnr!==undefined)s.push(`PSNR ${md.psnr}`);
    if(md.epe!==undefined)s.push(`EPE ${md.epe}`);
  }
  return s;
}
function build(){
  const g=document.getElementById("grid"); g.innerHTML="";
  let shown=0;
  for(const sha of D.shas){
    const row=document.createElement("div"); row.className="row";
    row.innerHTML=`<div class=sha>${sha}</div>`;
    const tiles=document.createElement("div"); tiles.className="tiles";
    let any=false;
    for(const m of state.methods){
      const t=document.createElement("div"); t.className="tile";
      const sc=metric(sha,m);
      if((D.avail[m][sha]||[]).includes(state.type)){
        any=true;
        t.innerHTML=`<video muted loop playsinline preload=none
          data-src="${D.prefix}/${m}/${sha}/${state.type}.mp4"></video>
          ${sc.length?`<div class=score>${sc.join("\n")}</div>`:""}
          <div class=cap><span class=m>${mname[m]}</span><span>${sc.join(" · ")}</span></div>`;
      } else {
        t.innerHTML=`<div class=na>${mname[m]}: n/a</div>
          <div class=cap><span class=m>${mname[m]}</span></div>`;
      }
      tiles.appendChild(t);
    }
    if(!any) continue;
    shown++;
    row.appendChild(tiles); g.appendChild(row);
  }
  document.getElementById("count").textContent=`${shown} samples`;
  observe();
}
const io=new IntersectionObserver(es=>{for(const e of es){
  const v=e.target;
  if(e.isIntersecting){ if(!v.src){v.src=v.dataset.src;} v.playbackRate=state.rate;
    if(state.playing) v.play().catch(()=>{}); }
  else v.pause();
}},{rootMargin:"200px"});
function observe(){document.querySelectorAll("video[data-src]").forEach(v=>{
  io.observe(v);
  v.onclick=()=>{ v.paused ? v.play().catch(()=>{}) : v.pause(); };
});}
state.playing=true;
document.getElementById("pp").onclick=()=>{
  state.playing=!state.playing;
  const b=document.getElementById("pp");
  b.innerHTML=state.playing?"&#10074;&#10074; pause":"&#9654; play";
  document.querySelectorAll("video").forEach(v=>{
    if(state.playing){ if(!v.src&&v.dataset.src)v.src=v.dataset.src; v.play().catch(()=>{}); }

  });
};
function ctls(){
  const ms=document.getElementById("meths");
  for(const [k,n] of D.methods){
    const l=document.createElement("label");
    l.innerHTML=`<input type=checkbox value=${k} ${state.methods.includes(k)?"checked":""}> ${n}`;

      if(e.target.checked) state.methods=D.methods.map(x=>x[0]).filter(x=>x===k||state.methods.includes(x));

      build();};
    ms.appendChild(l);
  }
  const sp=document.getElementById("speeds");
  for(const r of [0.25,0.5,1,2]){
    const l=document.createElement("label");
    l.innerHTML=`<input type=radio name=spd value=${r} ${r===state.rate?"checked":""}> ${r}x`;
