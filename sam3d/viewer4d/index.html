<!DOCTYPE html>
<!-- Interactive 4D gaussian-splat viewer for ff4d-sam3d results (.4dgs files). -->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ff4d-sam3d 4D viewer</title>
<style>
  html, body { margin:0; height:100%; background:#111; color:#ddd;
               font:14px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif; overflow:hidden; }
  #gl { position:absolute; inset:0; width:100%; height:100%; display:block; }
  #bar { position:absolute; left:0; right:0; top:0; display:flex; gap:10px; align-items:center;
         padding:8px 12px; background:rgba(17,17,17,.82); z-index:2; flex-wrap:wrap; }
  #bar select, #bar button { background:#222; color:#ddd; border:1px solid #444;
         border-radius:4px; padding:4px 8px; font:inherit; cursor:pointer; }
  #bar input[type=range] { width:180px; }
  #hint { position:absolute; bottom:10px; left:12px; color:#888; z-index:2; font-size:12px; }
  #stat { color:#888; font-size:12px; }
  #load { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
          color:#aaa; z-index:1; pointer-events:none; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="bar">
  <b>ff4d-sam3d 4D</b>
  <select id="scene"></select>
  <button id="play">⏸</button>
  <input type="range" id="frame" min="0" max="0" value="0" step="1">
  <span id="fno">0/0</span>
  <select id="speed"><option value="0.25">0.25×</option><option value="0.5">0.5×</option>
    <option value="1" selected>1×</option><option value="2">2×</option></select>
  <button id="reset">reset view</button>
  <span id="stat"></span>
</div>
<div id="hint">drag: orbit &nbsp; shift-drag / right-drag: pan &nbsp; scroll: zoom</div>
<div id="load">loading…</div>
<script>
"use strict";
const REC = 32, MAGIC = 0x34444753;
const canvas = document.getElementById("gl");
const gl = canvas.getContext("webgl2", { antialias: false, alpha: false });

const VS = `#version 300 es
precision highp float;
layout(location=0) in vec2 corner;
layout(location=1) in vec3 aPos;
layout(location=2) in vec3 aScale;
layout(location=3) in vec4 aColor;   // normalized u8
layout(location=4) in vec4 aRot;     // normalized u8, (q*128+128)/255, wxyz
uniform mat4 uView, uProj;
uniform vec2 uFocal, uViewport;
out vec4 vColor;
out vec2 vPos;
void main() {
  vec4 cam = uView * vec4(aPos, 1.0);
  if (cam.z < 0.05) { gl_Position = vec4(0.0, 0.0, 2.0, 1.0); return; }
  vec4 q = normalize(aRot * (255.0/128.0) - 1.0);
  float w=q.x, x=q.y, y=q.z, z=q.w;
  mat3 R = mat3(
    1.-2.*(y*y+z*z), 2.*(x*y+w*z),   2.*(x*z-w*y),
    2.*(x*y-w*z),    1.-2.*(x*x+z*z),2.*(y*z+w*x),
    2.*(x*z+w*y),    2.*(y*z-w*x),   1.-2.*(x*x+y*y));
  mat3 S = mat3(aScale.x,0.,0., 0.,aScale.y,0., 0.,0.,aScale.z);
  mat3 M = S * R;                      // sigma = M^T M = R^T S S R (row-vector conv)
  mat3 cov3 = transpose(M) * M;
  mat3 W = mat3(uView);
  float iz = 1.0 / cam.z;
  mat3 J = mat3(uFocal.x*iz, 0., 0.,  0., uFocal.y*iz, 0.,
                -uFocal.x*cam.x*iz*iz, -uFocal.y*cam.y*iz*iz, 0.);
  mat3 T = W * cov3 * transpose(W);
  mat3 cov2 = J * T * transpose(J);
  float a = cov2[0][0]+0.3, b = cov2[0][1], d = cov2[1][1]+0.3;
  float mid = 0.5*(a+d);
  float rad = length(vec2(0.5*(a-d), b));
  float l1 = mid + rad, l2 = max(mid - rad, 0.02);
  vec2 e1 = normalize(vec2(b, l1 - a));
  if (b == 0.0) e1 = (a >= d) ? vec2(1,0) : vec2(0,1);
  vec2 major = min(sqrt(2.0*l1), 1024.0) * e1;
  vec2 minor = min(sqrt(2.0*l2), 1024.0) * vec2(-e1.y, e1.x);
  vec4 clip = uProj * cam;
  vec2 off = (corner.x*major + corner.y*minor) / uViewport * 2.0 * clip.w;
  gl_Position = vec4(clip.xy + off, clip.z, clip.w);
  vColor = aColor;
  vPos = corner;
}`;
const FS = `#version 300 es
precision highp float;
in vec4 vColor;
in vec2 vPos;
out vec4 frag;
void main() {
  float A = -dot(vPos, vPos);
  if (A < -4.0) discard;
  float B = exp(A) * vColor.a;
  frag = vec4(vColor.rgb, B);
}`;

function compile(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(s);
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw gl.getProgramInfoLog(prog);
gl.useProgram(prog);
const U = n => gl.getUniformLocation(prog, n);

const quad = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, quad);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-2,-2, 2,-2, -2,2, 2,2]), gl.STATIC_DRAW);
const dataBuf = gl.createBuffer();
gl.disable(gl.DEPTH_TEST);
gl.enable(gl.BLEND);
gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

// scene state
let frames = [];        // per frame: {raw: ArrayBuffer, n, pos: Float32Array view copy}
let sorted = [];        // per frame: {buf: ArrayBuffer, epoch}
let sortEpoch = 0, curFrame = 0, playing = true, fps = 8, speed = 1;
let center = [0,0,1.5], radius = 2.2;
let az = -0.4, el = -0.25, pan = [0,0,0];

function parse4dgs(ab) {
  const dv = new DataView(ab);
  if (dv.getUint32(0, true) !== MAGIC) throw "bad magic";
  const F = dv.getUint32(4, true);
  fps = dv.getFloat32(8, true) || 8;
  const counts = new Uint32Array(ab, 16, F);
  let off = 16 + 4 * F;
  frames = []; sorted = [];
  for (let f = 0; f < F; f++) {
    const n = counts[f], bytes = n * REC;
    const raw = ab.slice(off, off + bytes); off += bytes;
    const fl = new Float32Array(raw);
    const pos = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) { pos[i*3] = fl[i*8]; pos[i*3+1] = fl[i*8+1]; pos[i*3+2] = fl[i*8+2]; }
    frames.push({ raw, n, pos });
    sorted.push(null);
  }
  // frame-0 centroid + extent -> orbit target
  const p0 = frames[0].pos; let c = [0,0,0];
  for (let i = 0; i < frames[0].n; i++) { c[0]+=p0[i*3]; c[1]+=p0[i*3+1]; c[2]+=p0[i*3+2]; }
  c = c.map(v => v / frames[0].n);
  let ext = 0;
  for (let i = 0; i < frames[0].n; i++) {
    const dx=p0[i*3]-c[0], dy=p0[i*3+1]-c[1], dz=p0[i*3+2]-c[2];
    ext = Math.max(ext, dx*dx+dy*dy+dz*dz);
  }
  center = c; radius = Math.sqrt(ext) * 2.5 + 0.2; pan = [0,0,0];
  curFrame = 0; sortEpoch++;
  document.getElementById("frame").max = F - 1;
  document.getElementById("load").style.display = "none";
}

// camera (OpenCV convention: y down, z forward)
function viewMatrix() {
  const cy = Math.cos(az), sy = Math.sin(az), cp = Math.cos(el), sp = Math.sin(el);
  const eye = [center[0]+pan[0] + radius*sy*cp, center[1]+pan[1] + radius*sp,
               center[2]+pan[2] - radius*cy*cp];
  const tgt = [center[0]+pan[0], center[1]+pan[1], center[2]+pan[2]];
  let fwd = [tgt[0]-eye[0], tgt[1]-eye[1], tgt[2]-eye[2]];
  const fl = Math.hypot(...fwd); fwd = fwd.map(v => v/fl);
  const upW = [0, 1, 0];                      // y-down world: +y is "down" on screen
  let right = [fwd[1]*upW[2]-fwd[2]*upW[1], fwd[2]*upW[0]-fwd[0]*upW[2], fwd[0]*upW[1]-fwd[1]*upW[0]];
  const rl = Math.hypot(...right); right = right.map(v => -v/rl);
  const dn = [fwd[1]*right[2]-fwd[2]*right[1], fwd[2]*right[0]-fwd[0]*right[2], fwd[0]*right[1]-fwd[1]*right[0]];
  return new Float32Array([
    right[0], dn[0], fwd[0], 0,
    right[1], dn[1], fwd[1], 0,
    right[2], dn[2], fwd[2], 0,
    -(right[0]*eye[0]+right[1]*eye[1]+right[2]*eye[2]),
    -(dn[0]*eye[0]+dn[1]*eye[1]+dn[2]*eye[2]),
    -(fwd[0]*eye[0]+fwd[1]*eye[1]+fwd[2]*eye[2]), 1]);
}
function projMatrix(w, h) {
  const fovy = 50 * Math.PI / 180, f = 1 / Math.tan(fovy/2), n = 0.02, fa = 100;
  return { m: new Float32Array([f*h/w,0,0,0, 0,f,0,0, 0,0,(fa+n)/(fa-n),1, 0,0,-2*fa*n/(fa-n),0]),
           focal: [f*h/2 * (1), f*h/2] };
}

function sortFrame(f, view) {
  const fr = frames[f], n = fr.n;
  const d = new Float32Array(n);
  const vz = [view[2], view[6], view[10], view[14]];
  for (let i = 0; i < n; i++)
    d[i] = vz[0]*fr.pos[i*3] + vz[1]*fr.pos[i*3+1] + vz[2]*fr.pos[i*3+2];
  const idx = Uint32Array.from({length: n}, (_, i) => i);
  idx.sort((a, b) => d[b] - d[a]);                          // back-to-front
  const src = new Uint32Array(fr.raw), out = new Uint32Array(n * 8);
  for (let i = 0; i < n; i++) {
    const s = idx[i] * 8, o = i * 8;
    for (let k = 0; k < 8; k++) out[o+k] = src[s+k];
  }
  sorted[f] = { buf: out.buffer, epoch: sortEpoch };
}

function draw() {
  const w = canvas.clientWidth * devicePixelRatio, h = canvas.clientHeight * devicePixelRatio;
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  gl.viewport(0, 0, w, h);
  gl.clearColor(0.066, 0.066, 0.066, 1);
  gl.clear(gl.COLOR_BUFFER_BIT);
  if (!frames.length) { requestAnimationFrame(draw); return; }
  const view = viewMatrix();
  const { m: proj, focal } = projMatrix(w, h);
  if (!sorted[curFrame] || sorted[curFrame].epoch !== sortEpoch) sortFrame(curFrame, view);
  const fr = frames[curFrame];
  gl.uniformMatrix4fv(U("uView"), false, view);
  gl.uniformMatrix4fv(U("uProj"), false, proj);
  gl.uniform2f(U("uFocal"), focal[0], focal[1]);
  gl.uniform2f(U("uViewport"), w, h);
  gl.bindBuffer(gl.ARRAY_BUFFER, quad);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  gl.bindBuffer(gl.ARRAY_BUFFER, dataBuf);
  gl.bufferData(gl.ARRAY_BUFFER, new Uint8Array(sorted[curFrame].buf), gl.DYNAMIC_DRAW);
  gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 3, gl.FLOAT, false, REC, 0); gl.vertexAttribDivisor(1, 1);
  gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2, 3, gl.FLOAT, false, REC, 12); gl.vertexAttribDivisor(2, 1);
  gl.enableVertexAttribArray(3); gl.vertexAttribPointer(3, 4, gl.UNSIGNED_BYTE, true, REC, 24); gl.vertexAttribDivisor(3, 1);
  gl.enableVertexAttribArray(4); gl.vertexAttribPointer(4, 4, gl.UNSIGNED_BYTE, true, REC, 28); gl.vertexAttribDivisor(4, 1);
  gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, fr.n);
  document.getElementById("stat").textContent = `${fr.n.toLocaleString()} splats`;
  document.getElementById("fno").textContent = `${curFrame + 1}/${frames.length}`;
  document.getElementById("frame").value = curFrame;
  requestAnimationFrame(draw);
}

// playback
let acc = 0, last = performance.now();
setInterval(() => {
  const now = performance.now();
  if (playing && frames.length) {
    acc += (now - last) / 1000 * fps * speed;
    if (acc >= 1) { curFrame = (curFrame + Math.floor(acc)) % frames.length; acc %= 1; }
  }
  last = now;
}, 30);

// controls
let drag = null;
canvas.addEventListener("contextmenu", e => e.preventDefault());
canvas.addEventListener("pointerdown", e => { drag = { x: e.clientX, y: e.clientY, b: e.button, sh: e.shiftKey }; });
window.addEventListener("pointerup", () => drag = null);
window.addEventListener("pointermove", e => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  drag.x = e.clientX; drag.y = e.clientY;
  if (drag.b === 2 || drag.sh) {
    const s = radius * 0.0015;
    pan[0] -= dx * s * Math.cos(az); pan[2] -= dx * s * Math.sin(az); pan[1] -= dy * s;
  } else {
    az += dx * 0.006; el = Math.max(-1.5, Math.min(1.5, el + dy * 0.006));
  }
  sortEpoch++;
});
canvas.addEventListener("wheel", e => {
  e.preventDefault();
  radius *= Math.exp(e.deltaY * 0.001);
  radius = Math.max(0.1, Math.min(50, radius));
  sortEpoch++;
}, { passive: false });

document.getElementById("play").onclick = () => {
  playing = !playing;
  document.getElementById("play").textContent = playing ? "⏸" : "▶";
};
document.getElementById("frame").oninput = e => { playing = false; document.getElementById("play").textContent = "▶"; curFrame = +e.target.value; };
document.getElementById("speed").onchange = e => speed = +e.target.value;
document.getElementById("reset").onclick = () => { az = -0.4; el = -0.25; pan = [0,0,0]; sortEpoch++; };

async function loadScene(name) {
  document.getElementById("load").style.display = "flex";
  document.getElementById("load").textContent = `loading ${name}…`;
  try {
    const r = await fetch(`scenes/${name}.4dgs`);
    if (!r.ok) throw `${r.status}`;
    parse4dgs(await r.arrayBuffer());
  } catch (err) {
    document.getElementById("load").textContent = `failed to load ${name}: ${err}`;
  }
}
async function init() {
  let scenes = [];
  try { scenes = await (await fetch("scenes/index.json")).json(); } catch (e) {}
  const sel = document.getElementById("scene");
  for (const s of scenes) {
    const o = document.createElement("option");
    o.value = s.id; o.textContent = s.label || s.id;
    sel.appendChild(o);
  }
  const want = new URLSearchParams(location.search).get("scene") || (scenes[0] && scenes[0].id);
  if (want) { sel.value = want; loadScene(want); }
  sel.onchange = () => { history.replaceState(null, "", `?scene=${sel.value}`); loadScene(sel.value); };
  requestAnimationFrame(draw);
}
init();
</script>
</body>
</html>
