<!DOCTYPE html>
<!-- Interactive 4D gaussian-splat viewer for ff4d-sam3d results (.4dgs files, v1 32B / v2 18B records). -->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ff4d-sam3d 4D viewer</title>
<style>
  html, body { margin:0; height:100%; background:#111; color:#ddd;
               font:14px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif; overflow:hidden; }
  #gl { position:absolute; inset:0; width:100%; height:100%; display:block; }
  #bar { position:absolute; left:0; right:0; top:0; display:flex; gap:10px; align-items:center;
         padding:8px 12px; background:rgba(17,17,17,.82); z-index:2; flex-wrap:wrap; }
  #bar select, #bar button { background:#222; color:#ddd; border:1px solid #444;
         border-radius:4px; padding:4px 8px; font:inherit; cursor:pointer; }
  #bar input[type=range] { width:180px; }
  #hint { position:absolute; bottom:10px; left:12px; color:#888; z-index:2; font-size:12px; }
  #stat { color:#888; font-size:12px; }
  #load { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
          color:#aaa; z-index:1; pointer-events:none; }
  #inset { position:absolute; left:12px; bottom:34px; height:200px; z-index:2; display:none;
           border:1px solid #333; border-radius:4px; background:#000; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="bar">
  <b>ff4d-sam3d 4D</b>
  <select id="scene"></select>
  <button id="play">⏸</button>
  <input type="range" id="frame" min="0" max="0" value="0" step="1">
  <span id="fno">0/0</span>
  <select id="speed"><option value="0.25">0.25×</option><option value="0.5">0.5×</option>
    <option value="1" selected>1×</option><option value="2">2×</option></select>
  <button id="reset">reset view</button>
  <span id="stat"></span>
</div>
<div id="hint">drag: orbit (full 360°) &nbsp; shift-drag / right-drag: pan &nbsp; scroll: zoom</div>
<div id="load">loading…</div>
<video id="inset" muted loop playsinline></video>
<script>
"use strict";
const MAGIC = 0x34444753;
const canvas = document.getElementById("gl");
const gl = canvas.getContext("webgl2", { antialias: false, alpha: false });

const VS = `#version 300 es
precision highp float;
layout(location=0) in vec2 corner;
layout(location=1) in vec3 aPos;
layout(location=2) in vec3 aScale;
layout(location=3) in vec4 aColor;   // normalized u8
layout(location=4) in vec4 aRot;     // normalized u8, (q*128+128)/255, wxyz
uniform mat4 uView, uProj;
uniform vec2 uFocal, uViewport;
out vec4 vColor;
out vec2 vPos;
void main() {
  vec4 cam = uView * vec4(aPos, 1.0);
  if (cam.z < 0.05) { gl_Position = vec4(0.0, 0.0, 2.0, 1.0); return; }
  vec4 q = normalize(aRot * (255.0/128.0) - 1.0);
  float w=q.x, x=q.y, y=q.z, z=q.w;
  mat3 R = mat3(
    1.-2.*(y*y+z*z), 2.*(x*y+w*z),   2.*(x*z-w*y),
    2.*(x*y-w*z),    1.-2.*(x*x+z*z),2.*(y*z+w*x),
    2.*(x*z+w*y),    2.*(y*z-w*x),   1.-2.*(x*x+y*y));
  mat3 S = mat3(aScale.x,0.,0., 0.,aScale.y,0., 0.,0.,aScale.z);
  mat3 M = S * R;
  mat3 cov3 = transpose(M) * M;
  mat3 W = mat3(uView);
  float iz = 1.0 / cam.z;
  mat3 J = mat3(uFocal.x*iz, 0., 0.,  0., uFocal.y*iz, 0.,
                -uFocal.x*cam.x*iz*iz, -uFocal.y*cam.y*iz*iz, 0.);
  mat3 T = W * cov3 * transpose(W);
  mat3 cov2 = J * T * transpose(J);
  float a = cov2[0][0]+0.3, b = cov2[0][1], d = cov2[1][1]+0.3;
  float mid = 0.5*(a+d);
  float rad = length(vec2(0.5*(a-d), b));
  float l1 = mid + rad, l2 = max(mid - rad, 0.02);
  vec2 e1 = normalize(vec2(b, l1 - a));
  if (b == 0.0) e1 = (a >= d) ? vec2(1,0) : vec2(0,1);
  vec2 major = min(sqrt(2.0*l1), 1024.0) * e1;
  vec2 minor = min(sqrt(2.0*l2), 1024.0) * vec2(-e1.y, e1.x);
  vec4 clip = uProj * cam;
  vec2 off = (corner.x*major + corner.y*minor) / uViewport * 2.0 * clip.w;
  gl_Position = vec4(clip.xy + off, clip.z, clip.w);
  vColor = aColor;
  vPos = corner;
}`;
const FS = `#version 300 es
precision highp float;
in vec4 vColor;
in vec2 vPos;
out vec4 frag;
void main() {
  float A = -dot(vPos, vPos);
  if (A < -4.0) discard;
  float B = exp(A) * vColor.a;
  frag = vec4(vColor.rgb, B);
}`;

function compile(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(s);
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw gl.getProgramInfoLog(prog);
gl.useProgram(prog);
const U = n => gl.getUniformLocation(prog, n);

const quad = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, quad);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-2,-2, 2,-2, -2,2, 2,2]), gl.STATIC_DRAW);
const dataBuf = gl.createBuffer();
gl.disable(gl.DEPTH_TEST);
gl.enable(gl.BLEND);
gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

// scene state — internal per-frame layout is always the v1 32B record
const REC = 32;
let frames = [];        // per frame: {raw: ArrayBuffer(32B recs), n, pos: Float32Array}
let sorted = [];
let sortEpoch = 0, curFrame = 0, playing = true, fps = 8, speed = 1;
const BASE = 0.5;                                  // "1x" plays at half real-time
const inset = document.getElementById("inset");
function insetRate() { try { inset.playbackRate = BASE * speed; } catch (e) {} }
function insetSeek() { if (inset.duration) inset.currentTime = (curFrame / fps) % inset.duration; }
let target = [0,0,1.5], radius = 2.2;
// trackball: world->cam rotation, row-major 3x3; identity = the conditioning-camera view
let V3 = [1,0,0, 0,1,0, 0,0,1];

function matMul3(A, B) {
  const C = new Array(9);
  for (let i = 0; i < 3; i++)
    for (let j = 0; j < 3; j++)
      C[i*3+j] = A[i*3]*B[j] + A[i*3+1]*B[3+j] + A[i*3+2]*B[6+j];
  return C;
}
function rotX(a){const c=Math.cos(a),s=Math.sin(a);return [1,0,0, 0,c,-s, 0,s,c];}
function rotY(a){const c=Math.cos(a),s=Math.sin(a);return [c,0,s, 0,1,0, -s,0,c];}

function frameFromV1(raw) {
  const n = raw.byteLength / REC;
  const fl = new Float32Array(raw);
  const pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { pos[i*3]=fl[i*8]; pos[i*3+1]=fl[i*8+1]; pos[i*3+2]=fl[i*8+2]; }
  return { raw, n, pos };
}
function frameFromV2(src, n, hdr) {              // 18B recs -> internal 32B recs
  const out = new ArrayBuffer(n * REC);
  const fo = new Float32Array(out), bo = new Uint8Array(out);
  const u8 = new Uint8Array(src);
  const pos = new Float32Array(n * 3);
  const [mnx,mny,mnz,mxx,mxy,mxz,lsn,lsx] = hdr;
  const ex=(mxx-mnx)/65535, ey=(mxy-mny)/65535, ez=(mxz-mnz)/65535, ls=(lsx-lsn)/255;
  for (let i = 0; i < n; i++) {
    const s = i * 18, o = i * 8, ob = i * 32;
    const px = u8[s] | (u8[s+1]<<8), py = u8[s+2] | (u8[s+3]<<8), pz = u8[s+4] | (u8[s+5]<<8);
    fo[o]   = pos[i*3]   = mnx + px*ex;
    fo[o+1] = pos[i*3+1] = mny + py*ey;
    fo[o+2] = pos[i*3+2] = mnz + pz*ez;
    fo[o+3] = Math.exp(lsn + u8[s+6]*ls);
    fo[o+4] = Math.exp(lsn + u8[s+7]*ls);
    fo[o+5] = Math.exp(lsn + u8[s+8]*ls);
    for (let k = 0; k < 8; k++) bo[ob+24+k] = u8[s+9+k];   // rgba + rot
  }
  return { raw: out, n, pos };
}

function parse4dgs(ab) {
  const dv = new DataView(ab);
  if (dv.getUint32(0, true) !== MAGIC) throw "bad magic";
  const F = dv.getUint32(4, true);
  fps = dv.getFloat32(8, true) || 8;
  const ver = dv.getUint32(12, true);
  const counts = new Uint32Array(ab, 16, F);
  frames = []; sorted = [];
  if (ver >= 2) {
    const hdrs = new Float32Array(ab, 16 + 4*F, 8*F);
    let off = 16 + 4*F + 32*F;
    for (let f = 0; f < F; f++) {
      const bytes = counts[f] * 18;
      frames.push(frameFromV2(ab.slice(off, off + bytes), counts[f], hdrs.subarray(f*8, f*8+8)));
      off += bytes; sorted.push(null);
    }
  } else {
    let off = 16 + 4*F;
    for (let f = 0; f < F; f++) {
      const bytes = counts[f] * REC;
      frames.push(frameFromV1(ab.slice(off, off + bytes)));
      off += bytes; sorted.push(null);
    }
  }
  const p0 = frames[0].pos; let c = [0,0,0];
  for (let i = 0; i < frames[0].n; i++) { c[0]+=p0[i*3]; c[1]+=p0[i*3+1]; c[2]+=p0[i*3+2]; }
  c = c.map(v => v / frames[0].n);
  let ext = 0;
  for (let i = 0; i < frames[0].n; i++) {
    const dx=p0[i*3]-c[0], dy=p0[i*3+1]-c[1], dz=p0[i*3+2]-c[2];
    ext = Math.max(ext, dx*dx+dy*dy+dz*dz);
  }
  target = c; radius = Math.sqrt(ext) * 2.5 + 0.2;
  V3 = [1,0,0, 0,1,0, 0,0,1];
  curFrame = 0; sortEpoch++;
  document.getElementById("frame").max = F - 1;
  document.getElementById("load").style.display = "none";
}

function viewMatrix() {
  // eye = target - V3^T [0,0,radius]; view rows = V3
  const ex = target[0] - (V3[6]*radius), ey = target[1] - (V3[7]*radius), ez = target[2] - (V3[8]*radius);
  return new Float32Array([
    V3[0], V3[3], V3[6], 0,
    V3[1], V3[4], V3[7], 0,
    V3[2], V3[5], V3[8], 0,
    -(V3[0]*ex + V3[1]*ey + V3[2]*ez),
    -(V3[3]*ex + V3[4]*ey + V3[5]*ez),
    -(V3[6]*ex + V3[7]*ey + V3[8]*ez), 1]);
}
function projMatrix(w, h) {
  const fovy = 50 * Math.PI / 180, f = 1 / Math.tan(fovy/2), n = 0.02, fa = 100;
  // negative y: OpenCV camera (+y down) -> NDC (+y up), so the start view is upright
  return { m: new Float32Array([f*h/w,0,0,0, 0,-f,0,0, 0,0,(fa+n)/(fa-n),1, 0,0,-2*fa*n/(fa-n),0]),
           focal: [f*h/2, f*h/2] };
}

function sortFrame(f, view) {
  const fr = frames[f], n = fr.n;
  const d = new Float32Array(n);
  const vz = [view[2], view[6], view[10]];
  for (let i = 0; i < n; i++)
    d[i] = vz[0]*fr.pos[i*3] + vz[1]*fr.pos[i*3+1] + vz[2]*fr.pos[i*3+2];
  const idx = Uint32Array.from({length: n}, (_, i) => i);
  idx.sort((a, b) => d[b] - d[a]);                          // back-to-front
  const src = new Uint32Array(fr.raw), out = new Uint32Array(n * 8);
  for (let i = 0; i < n; i++) {
    const s = idx[i] * 8, o = i * 8;
    for (let k = 0; k < 8; k++) out[o+k] = src[s+k];
  }
  sorted[f] = { buf: out.buffer, epoch: sortEpoch };
}

function draw() {
  const w = canvas.clientWidth * devicePixelRatio, h = canvas.clientHeight * devicePixelRatio;
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  gl.viewport(0, 0, w, h);
  gl.clearColor(0.066, 0.066, 0.066, 1);
  gl.clear(gl.COLOR_BUFFER_BIT);
  if (!frames.length) { requestAnimationFrame(draw); return; }
  const view = viewMatrix();
  const { m: proj, focal } = projMatrix(w, h);
  if (!sorted[curFrame] || sorted[curFrame].epoch !== sortEpoch) sortFrame(curFrame, view);
  const fr = frames[curFrame];
  gl.uniformMatrix4fv(U("uView"), false, view);
  gl.uniformMatrix4fv(U("uProj"), false, proj);
  gl.uniform2f(U("uFocal"), focal[0], focal[1]);
  gl.uniform2f(U("uViewport"), w, h);
  gl.bindBuffer(gl.ARRAY_BUFFER, quad);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  gl.bindBuffer(gl.ARRAY_BUFFER, dataBuf);
  gl.bufferData(gl.ARRAY_BUFFER, new Uint8Array(sorted[curFrame].buf), gl.DYNAMIC_DRAW);
  gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 3, gl.FLOAT, false, REC, 0); gl.vertexAttribDivisor(1, 1);
  gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2, 3, gl.FLOAT, false, REC, 12); gl.vertexAttribDivisor(2, 1);
  gl.enableVertexAttribArray(3); gl.vertexAttribPointer(3, 4, gl.UNSIGNED_BYTE, true, REC, 24); gl.vertexAttribDivisor(3, 1);
  gl.enableVertexAttribArray(4); gl.vertexAttribPointer(4, 4, gl.UNSIGNED_BYTE, true, REC, 28); gl.vertexAttribDivisor(4, 1);
  gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, fr.n);
  document.getElementById("stat").textContent = `${fr.n.toLocaleString()} splats`;
  document.getElementById("fno").textContent = `${curFrame + 1}/${frames.length}`;
  document.getElementById("frame").value = curFrame;
  requestAnimationFrame(draw);
}

// playback
let acc = 0, last = performance.now();
setInterval(() => {
  const now = performance.now();
  if (playing && frames.length) {
    acc += (now - last) / 1000 * fps * BASE * speed;
    if (acc >= 1) {
      const nf = (curFrame + Math.floor(acc)) % frames.length;
      if (nf < curFrame && inset.duration) inset.currentTime = 0;   // resync on loop wrap
      curFrame = nf; acc %= 1;
    }
  }
  last = now;
}, 30);

// controls — trackball: premultiply camera-space rotations, no clamps
let drag = null;
canvas.addEventListener("contextmenu", e => e.preventDefault());
canvas.addEventListener("pointerdown", e => { drag = { x: e.clientX, y: e.clientY, b: e.button, sh: e.shiftKey }; });
window.addEventListener("pointerup", () => drag = null);
window.addEventListener("pointermove", e => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  drag.x = e.clientX; drag.y = e.clientY;
  if (drag.b === 2 || drag.sh) {
    const s = radius * 0.0015;
    // pan in camera plane: target += V3^T [-dx*s, -dy*s, 0]
    target[0] -= (V3[0]*dx + V3[3]*dy) * s;
    target[1] -= (V3[1]*dx + V3[4]*dy) * s;
    target[2] -= (V3[2]*dx + V3[5]*dy) * s;
  } else {
    V3 = matMul3(matMul3(rotX(dy * 0.006), rotY(-dx * 0.006)), V3);
  }
  sortEpoch++;
});
canvas.addEventListener("wheel", e => {
  e.preventDefault();
  radius *= Math.exp(e.deltaY * 0.001);
  radius = Math.max(0.05, Math.min(50, radius));
  sortEpoch++;
}, { passive: false });

document.getElementById("play").onclick = () => {
  playing = !playing;
  document.getElementById("play").textContent = playing ? "⏸" : "▶";
  if (playing) { insetSeek(); inset.play().catch(()=>{}); } else inset.pause();
};
document.getElementById("frame").oninput = e => { playing = false; document.getElementById("play").textContent = "▶"; curFrame = +e.target.value; inset.pause(); insetSeek(); };
document.getElementById("speed").onchange = e => { speed = +e.target.value; insetRate(); };
document.getElementById("reset").onclick = () => { V3 = [1,0,0, 0,1,0, 0,0,1]; sortEpoch++; };

async function loadScene(name) {
  document.getElementById("load").style.display = "flex";
  document.getElementById("load").textContent = `loading ${name}…`;
  try {
    const meta = (window.__scenes || []).find(x => x.id === name);
    let ab;
    if (meta && meta.parts > 1) {              // large scenes ship as split parts
      const bufs = [];
      for (let i = 0; i < meta.parts; i++) {
        const r = await fetch(`scenes/${name}.4dgs.p${i}`);
        if (!r.ok) throw `${r.status}`;
        bufs.push(await r.arrayBuffer());
      }
      const tot = bufs.reduce((a, b) => a + b.byteLength, 0);
      const u = new Uint8Array(tot);
      let o = 0;
      for (const b of bufs) { u.set(new Uint8Array(b), o); o += b.byteLength; }
      ab = u.buffer;
    } else {
      const r = await fetch(`scenes/${name}.4dgs`);
      if (!r.ok) throw `${r.status}`;
      ab = await r.arrayBuffer();
    }
    parse4dgs(ab);
  } catch (err) {
    document.getElementById("load").textContent = `failed to load ${name}: ${err}`;
    return;
  }
  // input-video inset (raw footage with the mask tinted), like Lift4D's corner overlay
  inset.style.display = "none";
  inset.src = `scenes/${name}_input.mp4`;
  inset.onloadeddata = () => { inset.style.display = "block"; insetRate(); insetSeek();
                               if (playing) inset.play().catch(()=>{}); };
  inset.onerror = () => { inset.style.display = "none"; };
}
async function init() {
  let scenes = [];
  try { scenes = await (await fetch("scenes/index.json")).json(); } catch (e) {}
  window.__scenes = scenes;
  const sel = document.getElementById("scene");
  for (const s of scenes) {
    const o = document.createElement("option");
    o.value = s.id; o.textContent = s.label || s.id;
    sel.appendChild(o);
  }
  const want = new URLSearchParams(location.search).get("scene") || (scenes[0] && scenes[0].id);
  if (want) { sel.value = want; loadScene(want); }
  sel.onchange = () => { history.replaceState(null, "", `?scene=${sel.value}`); loadScene(sel.value); };
  requestAnimationFrame(draw);
}
init();
</script>
</body>
</html>
